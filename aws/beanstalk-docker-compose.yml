version: "3.7"

services:
  frontend:
    image: frappe/erpnext:v16
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
    ports:
      - "80:8080"
    depends_on:
      - backend
      - websocket

  backend:
    image: frappe/erpnext:v16
    command: ["bench", "start"]
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_CACHE=redis://${REDIS_HOST}:6379/0
      - REDIS_QUEUE=redis://${REDIS_HOST}:6379/1
      - REDIS_SOCKETIO=redis://${REDIS_HOST}:6379/2
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ERPNEXT_VERSION=${ERPNEXT_VERSION:-v16}
    volumes:
      - sites:/home/frappe/frappe-bench/sites

  websocket:
    image: frappe/erpnext:v16
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    environment:
      - REDIS_SOCKETIO=redis://${REDIS_HOST}:6379/2
    volumes:
      - sites:/home/frappe/frappe-bench/sites

  scheduler:
    image: frappe/erpnext:v16
    command: ["bench", "schedule"]
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_CACHE=redis://${REDIS_HOST}:6379/0
      - REDIS_QUEUE=redis://${REDIS_HOST}:6379/1
    volumes:
      - sites:/home/frappe/frappe-bench/sites

  worker:
    image: frappe/erpnext:v16
    command: ["bench", "worker", "--queue", "default,short,long"]
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_CACHE=redis://${REDIS_HOST}:6379/0
      - REDIS_QUEUE=redis://${REDIS_HOST}:6379/1
    volumes:
      - sites:/home/frappe/frappe-bench/sites

volumes:
  sites:
