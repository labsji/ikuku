name: Release

on:
  push:
    tags:
      - 'v*'
      - '!*-kiro'

jobs:
  build-lite:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install NSIS
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Fetch bind (open-source)
        run: |
          New-Item -ItemType Directory -Force -Path shared | Out-Null
          Invoke-WebRequest -Uri "https://github.com/labsji/erpnext-bind/releases/latest/download/bind.tar.gz" -OutFile shared/bind.tar.gz
          if (!(Test-Path shared/bind.tar.gz) -or (Get-Item shared/bind.tar.gz).Length -lt 1000) {
            Write-Host "Release asset not found, building from source..."
            Invoke-WebRequest -Uri "https://github.com/labsji/erpnext-bind/archive/refs/heads/main.tar.gz" -OutFile /tmp/bind-src.tar.gz
            tar xzf /tmp/bind-src.tar.gz -C /tmp/
            tar czf shared/bind.tar.gz -C /tmp/bind-main bind/
          }
      - name: Build lite
        run: powershell -ExecutionPolicy Bypass -File build-installer.ps1 -Variant lite
      - uses: actions/upload-artifact@v4
        with:
          name: ikuku-lite
          path: ikuku-lite.exe

  build-full:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install NSIS
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1
      - name: Fetch bundle + bind
        run: |
          New-Item -ItemType Directory -Force -Path shared | Out-Null
          aws s3 sync s3://ikuku-releases/bundle/ bundle/
          Invoke-WebRequest -Uri "https://github.com/labsji/erpnext-bind/releases/latest/download/bind.tar.gz" -OutFile shared/bind.tar.gz
          if (!(Test-Path shared/bind.tar.gz) -or (Get-Item shared/bind.tar.gz).Length -lt 1000) {
            Invoke-WebRequest -Uri "https://github.com/labsji/erpnext-bind/archive/refs/heads/main.tar.gz" -OutFile /tmp/bind-src.tar.gz
            tar xzf /tmp/bind-src.tar.gz -C /tmp/
            tar czf shared/bind.tar.gz -C /tmp/bind-main bind/
          }
      - name: Build full
        run: powershell -ExecutionPolicy Bypass -File build-installer.ps1 -Variant full
      - name: Zip full package
        run: Compress-Archive -Path ikuku-full.exe, bundle -DestinationPath ikuku-full.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ikuku-full
          path: ikuku-full.zip

  release:
    needs: [build-lite, build-full]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ikuku-lite
      - uses: actions/download-artifact@v4
        with:
          name: ikuku-full
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ikuku-lite.exe
            ikuku-full.zip
          generate_release_notes: true
