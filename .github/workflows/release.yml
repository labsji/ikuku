name: Release

on:
  push:
    tags:
      - 'v*-kiro'

jobs:
  build-lite:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install NSIS
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1
      - name: Fetch kiro binaries into shared/
        run: |
          aws s3 cp s3://ikuku-releases/kiro/kiro-cli shared/kiro-cli
          aws s3 cp s3://ikuku-releases/kiro/kiro-cli-chat shared/kiro-cli-chat
          aws s3 cp s3://ikuku-releases/bind/bind.tar.gz shared/bind.tar.gz
      - name: Fetch tray app binary
        run: aws s3 cp s3://ikuku-releases/tray/ikuku-tray.exe ikuku-tray.exe
      - name: Build lite
        run: powershell -ExecutionPolicy Bypass -File build-installer.ps1 -Variant lite
      - uses: actions/upload-artifact@v4
        with:
          name: ikuku-kiro-lite
          path: ikuku-kiro-lite.exe

  build-full:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install NSIS
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1
      - name: Fetch bundle
        run: aws s3 sync s3://ikuku-releases/bundle/ bundle/
      - name: Fetch kiro binaries into shared/
        run: |
          aws s3 cp s3://ikuku-releases/kiro/kiro-cli shared/kiro-cli
          aws s3 cp s3://ikuku-releases/kiro/kiro-cli-chat shared/kiro-cli-chat
          aws s3 cp s3://ikuku-releases/bind/bind.tar.gz shared/bind.tar.gz
      - name: Fetch tray app binary
        run: aws s3 cp s3://ikuku-releases/tray/ikuku-tray.exe ikuku-tray.exe
      - name: Build full
        run: powershell -ExecutionPolicy Bypass -File build-installer.ps1 -Variant full
      - name: Zip full package
        run: Compress-Archive -Path ikuku-kiro-full.exe, bundle -DestinationPath ikuku-kiro-full.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ikuku-kiro-full
          path: ikuku-kiro-full.zip

  release:
    needs: [build-lite, build-full]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ikuku-kiro-lite
      - uses: actions/download-artifact@v4
        with:
          name: ikuku-kiro-full
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ikuku-kiro-lite.exe
            ikuku-kiro-full.zip
          generate_release_notes: true
