# Build ikuku installer
name: Build Installer

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Installer variant'
        required: true
        default: 'lite'
        type: choice
        options:
          - lite
          - full
  push:
    paths:
      - '*.ps1'
      - '*.nsi'
      - 'init.sh'
      - 'docker-compose.yml'
      - 'shared/**'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: windows-latest
    env:
      VARIANT: ${{ inputs.variant || 'lite' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build ${{ env.VARIANT }} installer
        run: powershell -ExecutionPolicy Bypass -File build-installer.ps1 -Variant ${{ env.VARIANT }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ikuku-${{ env.VARIANT }}
          path: ikuku-${{ env.VARIANT }}.exe
