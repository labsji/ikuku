name: Build Installer

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Installer variant'
        required: true
        default: 'lite'
        type: choice
        options:
          - lite
          - full
  push:
    branches:
      - main
    paths:
      - '*.ps1'
      - '*.nsi'
      - 'init.sh'
      - 'docker-compose.yml'
      - 'shared/**'

jobs:
  bundle:
    if: inputs.variant == 'full'
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Trigger CodeBuild
        run: |
          BUILD_ID=$(aws codebuild start-build --project-name ikuku-bundle --query 'build.id' --output text)
          echo "Waiting for CodeBuild $BUILD_ID..."
          while true; do
            STATUS=$(aws codebuild batch-get-builds --ids "$BUILD_ID" --query 'builds[0].buildStatus' --output text)
            echo "  Status: $STATUS"
            [ "$STATUS" != "IN_PROGRESS" ] && break
            sleep 30
          done
          [ "$STATUS" = "SUCCEEDED" ] || { echo "CodeBuild failed: $STATUS"; exit 1; }

  build:
    needs: [bundle]
    if: always() && (needs.bundle.result == 'success' || needs.bundle.result == 'skipped')
    runs-on: windows-latest
    env:
      VARIANT: ${{ inputs.variant || 'lite' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install NSIS
        run: |
          choco install nsis -y
          echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Fetch bundle
        if: env.VARIANT == 'full'
        run: aws s3 sync s3://ikuku-releases/bundle/ bundle/

      - name: Fetch kiro binaries into shared/
        run: |
          aws s3 cp s3://ikuku-releases/kiro/kiro-cli shared/kiro-cli
          aws s3 cp s3://ikuku-releases/kiro/kiro-cli-chat shared/kiro-cli-chat
          aws s3 cp s3://ikuku-releases/bind/bind.tar.gz shared/bind.tar.gz

      - name: Build installer
        run: powershell -ExecutionPolicy Bypass -File build-installer.ps1 -Variant ${{ env.VARIANT }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ikuku-${{ env.VARIANT }}
          path: ikuku-${{ env.VARIANT }}.exe
